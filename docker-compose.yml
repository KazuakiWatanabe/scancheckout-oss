services:
  db:
    image: postgres:16
    container_name: scancheckout-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-odoo}
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odoo}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odoo} -d ${POSTGRES_DB:-odoo}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - scancheckout-net
    restart: unless-stopped

  odoo-init:
    image: odoo:19.0
    container_name: scancheckout-odoo-init
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      USER: ${POSTGRES_USER:-odoo}
      PASSWORD: ${POSTGRES_PASSWORD:-odoo}
    command:
      - odoo
      - --database=${POSTGRES_DB:-odoo}
      - --init=base
      - --without-demo=all
      - --stop-after-init
    volumes:
      - odoo-data:/var/lib/odoo
      - ./odoo/addons:/mnt/extra-addons
    networks:
      - scancheckout-net
    restart: "no"

  odoo:
    image: odoo:19.0
    container_name: scancheckout-odoo
    depends_on:
      db:
        condition: service_healthy
      odoo-init:
        condition: service_completed_successfully
    ports:
      - "8069:8069"
    environment:
      HOST: db
      USER: ${POSTGRES_USER:-odoo}
      PASSWORD: ${POSTGRES_PASSWORD:-odoo}
    volumes:
      - odoo-data:/var/lib/odoo
      - ./odoo/addons:/mnt/extra-addons
    networks:
      - scancheckout-net
    restart: unless-stopped

  api:
    build: ./services/api
    container_name: scancheckout-api
    ports:
      - "8000:8000"
    volumes:
      - ./services/api:/app
    environment:
      ODOO_URL: http://odoo:8069
      ODOO_DB: ${POSTGRES_DB:-odoo}
      ODOO_USER: ${ODOO_USER:-admin}
      ODOO_PASSWORD: ${ODOO_PASSWORD:-admin}
    depends_on:
      odoo:
        condition: service_started
    networks:
      - scancheckout-net
    restart: unless-stopped

volumes:
  db-data:
  odoo-data:

networks:
  scancheckout-net:
    driver: bridge
